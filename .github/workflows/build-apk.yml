name: Build CurrencyManual APK

on:
push:
branches: [main]
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout source
    uses: actions/checkout@v4

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v4
    with:
      packages: platform-tools

  - name: Install Android SDK platform
    run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

  - name: Extract project
    run: unzip -o CurrencyManual-source.zip

  - name: Build debug APK
    run: gradle -p CurrencyManual --no-daemon assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: CurrencyManual-APK
      path: CurrencyManual/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
      retention-days: 14
